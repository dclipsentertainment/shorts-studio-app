name: Verify image-first DClips story video
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/storyboard.py
      - scripts/render.py
      - scripts/scene_automation.py
      - scripts/test_scene_automation.py
      - scripts/test_illustrated_story.py
      - scripts/test_illustrated_ui.js
      - app.js
      - styles.css
      - .github/workflows/test-illustrated-story.yml
permissions:
  contents: read
jobs:
  scene-audio-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image and video engine for offline tests
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo timeout 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq || echo "Package index refresh unavailable; trying the runner index."
          sudo timeout 180s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Test illustrated scenes and narrated intro
        run: |
          python -m compileall -q scripts
          python scripts/test_illustrated_story.py
          python scripts/test_scene_automation.py
      - name: Validate dashboard
        run: |
          node --check app.js
          node scripts/test_illustrated_ui.js
          node scripts/test_caption_ui.js
          node scripts/test_review_gate.js

