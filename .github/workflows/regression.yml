name: DClips complete regression checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo timeout 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq || echo "Package index refresh unavailable; trying the runner index."
          sudo timeout 180s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Run every offline regression and integration entry point
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          for test in scripts/test_*.js; do node "$test"; done
          for test in scripts/test_*.py; do python "$test"; done
          bash scripts/build_cloudflare_pages.sh
          python scripts/make_app_release.py --out /tmp/verified-app.zip
      - name: Browser integration checks
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
          node scripts/browser_regressions.cjs
