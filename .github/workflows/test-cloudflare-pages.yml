name: Verify public DClips Cloudflare Pages build
on:
  push:
    paths:
      - index.html
      - app.js
      - asmr.js
      - scripts/test_asmr_ui.js
      - cloud-pack.js
      - scripts/test_cloud_pack.js
      - story-series.js
      - scripts/test_story_series.js
      - github-usage.js
      - styles.css
      - cloudflare/**
      - scripts/build_cloudflare_pages.sh
      - scripts/test_github_usage.js
      - scripts/test_caption_ui.js
      - .github/workflows/test-cloudflare-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and validate Cloudflare Pages site
        run: bash scripts/build_cloudflare_pages.sh
      - name: Verify only intended public assets are shipped
        run: |
          test "$(find dist-cloudflare -maxdepth 1 -type f | wc -l)" -eq 9
          test ! -e dist-cloudflare/scripts
          test ! -e dist-cloudflare/user-data
          test ! -e dist-cloudflare/reports
          test ! -e dist-cloudflare/.github
          grep -q 'data-nav="usage"' dist-cloudflare/index.html
          echo 'PASS: public site is self-contained, with separated navigation and no credentials.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages-preview-bundle
          path: dist-cloudflare/
          retention-days: 7

