name: Publish Shorts Studio app release
on:
  push:
    branches: [main]
    paths:
      - VERSION.json
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version, e.g. v0.14.0 (must match VERSION.json)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/regression.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open('VERSION.json', encoding='utf-8'))['version']
          tag = os.environ.get('RELEASE_TAG') or 'v' + version
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('RELEASE_TAG=' + tag + '\n')
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag), 'Tag must be vMAJOR.MINOR.PATCH'
          assert tag == 'v' + version, f'Tag {tag} does not match VERSION.json {version}'
          PY
      - name: Sanity-check application code
        run: |
          node --check app.js
          node --check asmr.js
          node scripts/test_asmr_ui.js
          node --check story-series.js
          node --check quick-create.js
          node scripts/test_quick_create.js
          node --check cloud-pack.js
          node scripts/test_cloud_pack.js
          node scripts/test_story_series.js
          node --check github-usage.js
          node scripts/test_github_usage.js
          node scripts/test_review_gate.js
          node scripts/test_illustrated_ui.js
          python -m compileall -q scripts
      - name: Package public code only
        run: python scripts/make_app_release.py --out dist/shorts-studio-app.zip
      - name: Check packaged application and checksum
        run: |
          python - <<'PYCODE'
          import pathlib,zipfile,json
          with zipfile.ZipFile('dist/shorts-studio-app.zip') as z:
              assert z.testzip() is None
              assert any(n.endswith('scripts/artifact_identity.py') for n in z.namelist())
              z.extractall('/tmp/dclips-release-check')
          PYCODE
          sha256sum dist/shorts-studio-app.zip > dist/shorts-studio-app.zip.sha256
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/shorts-studio-app.zip dist/shorts-studio-app.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Shorts Studio $RELEASE_TAG" \
            --notes "Code-only app update. Does not contain footage, user data or credentials."

